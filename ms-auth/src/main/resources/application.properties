spring.application.name=ms-auth
server.port=${SERVER_PORT:9000}
app.auth.issuer=${AUTH_ISSUER_URI:http://localhost:9000}
app.auth.client-id=${OAUTH_CLIENT_ID:frontend-client}
app.auth.client-secret=${OAUTH_CLIENT_SECRET:secret123}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Logging detallado de Spring Security para ver el flujo OAuth2 en consola
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
