spring.application.name=ms-frontend
server.port=${SERVER_PORT:8083}

app.auth.token-url=${AUTH_TOKEN_URL:http://localhost:9000/oauth2/token}
app.auth.client-id=${OAUTH_CLIENT_ID:frontend-client}
app.auth.client-secret=${OAUTH_CLIENT_SECRET:secret123}
app.gateway.base-url=${GATEWAY_BASE_URL:http://localhost:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Logging detallado para ver el flujo OAuth2 en consola
logging.level.com.example.msfrontend=DEBUG
logging.level.org.springframework.web.client=DEBUG
