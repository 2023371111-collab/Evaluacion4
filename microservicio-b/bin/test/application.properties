server.port=0
spring.application.name=microserviciob
spring.datasource.url=jdbc:h2:mem:msb-test;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS msb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=msb
spring.main.allow-bean-definition-overriding=true
eureka.client.enabled=false
